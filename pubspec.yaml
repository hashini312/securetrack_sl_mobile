name: securetrack_sl
description: "SecureTrack SL - Sri Lanka Customs Unified Mobile Portal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  intl: ^0.20.2
  http: ^1.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.4
  shared_preferences: ^2.5.6
  local_auth: ^2.3.0
  audioplayers: ^6.0.0
  easy_localization: ^3.0.8
  google_maps_flutter: ^2.18.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/translations/
